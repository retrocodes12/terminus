<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terminus</title>
<meta name="description" content="One light goes out every week.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101113'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23FF4D00'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Archivo";
    font-weight: 500 700;
    font-stretch: 125%;
    font-display: swap;
    src: url("font/archivo-expanded-latin.woff2") format("woff2");
  }
  :root {
    --bg: #101113;
    --ink: #EDEAE6;
    --muted: #8A867D;
    --spent: #2E3033;
    --accent: #FF4D00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-stretch: 125%;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--accent); color: var(--bg); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(48px, 10vh, 120px) clamp(20px, 6vw, 96px) 0;
  }
  h1 {
    font-size: clamp(42px, 10vw, 124px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  h1 .dark { color: var(--muted); }
  .clock {
    margin-top: clamp(16px, 3vh, 36px);
    font-size: clamp(14px, 2.2vw, 22px);
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .clock b { color: var(--ink); font-weight: 500; }
  .caption {
    margin-top: auto;
    padding: clamp(24px, 6vh, 64px) 0 18px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  #wall {
    flex: none;
    display: grid;
    grid-template-columns: repeat(58, 1fr);
    gap: 0.6vw;
    width: 100%;
    padding: 0 2px 2px;
  }
  #wall i {
    aspect-ratio: 1;
    background: var(--ink);
  }
  #wall i.spent { background: none; box-shadow: inset 0 0 0 1px var(--spent); }
  #wall i.now { background: var(--accent); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    #wall i.now { animation: none; }
  }
  @media (max-width: 640px) {
    #wall { grid-template-columns: repeat(29, 1fr); gap: 1.1vw; }
  }
</style>
</head>
<body>
<main>
  <h1 id="head">&nbsp;<br>&nbsp;</h1>
  <p class="clock" id="clock" aria-hidden="true"></p>
  <p class="caption">ONE LIGHT GOES OUT EVERY WEEK</p>
</main>
<div id="wall" role="img" aria-label="A wall of 522 lights, one for each week of the 2020s. The dead ones stay dark."></div>
<script>
  const DAY = 86400000, WEEK = 7 * DAY;
  const START = Date.UTC(2020, 0, 1), TARGET = Date.UTC(2030, 0, 1);
  const TOTAL = Math.ceil((TARGET - START) / WEEK); // 522
  const head = document.getElementById("head");
  const clock = document.getElementById("clock");
  const wall = document.getElementById("wall");
  const fmt = n => n.toLocaleString("en-US");
  const pad = n => String(n).padStart(2, "0");
  let litWeek = -1;

  function build(now) {
    const spent = Math.min(Math.floor((now - START) / WEEK), TOTAL - 1);
    if (spent === litWeek) return;
    litWeek = spent;
    const over = now >= TARGET;
    wall.replaceChildren(...Array.from({ length: TOTAL }, (_, i) => {
      const c = document.createElement("i");
      if (!over && i === spent) c.className = "now";
      else if (i < spent || over) c.className = "spent";
      return c;
    }));
  }

  function tick() {
    const now = Date.now();
    build(now);
    if (now >= TARGET) {
      head.innerHTML = 'the wall<br><span class="dark">is dark.</span>';
      clock.textContent = "";
      document.querySelector(".caption").textContent = "ALL 522 LIGHTS ARE OUT";
      return;
    }
    const left = TARGET - now;
    const days = Math.floor(left / DAY);
    const h = Math.floor(left % DAY / 3600000);
    const m = Math.floor(left % 3600000 / 60000);
    const s = Math.floor(left % 60000 / 1000);
    head.innerHTML = fmt(Math.ceil(left / DAY)) + ' days<br><span class="dark">then dark.</span>';
    clock.innerHTML = "<b>" + fmt(days) + "</b> D <b>" + pad(h) + "</b> H <b>" +
      pad(m) + "</b> M <b>" + pad(s) + "</b> S";
    setTimeout(tick, 1000 - now % 1000);
  }
  tick();
</script>
</body>
</html>
